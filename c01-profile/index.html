<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C1 — User profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="profile">
      <header class="profile__header">
        <img
          class="profile__avatar"
          src="https://i.pravatar.cc/160?img=12"
          alt="Avatar: Anna Kowalska"
          width="160"
          height="160"
        />

        <div class="profile__info">
          <h1 class="profile__name">Anna Kowalska</h1>
          <p class="profile__bio">
            Frontend developer from Kraków. Loves CSS Grid, good coffee and layouts
            that don't fall apart when the width changes.
          </p>
        </div>
      </header>
      <ul class="profile__stats">
        <li class="stat">
          <span class="stat__value">128</span>
          <span class="stat__label">Posts</span>
        </li>
        <li class="stat">
          <span class="stat__value">4.2K</span>
          <span class="stat__label">Followers</span>
        </li>
        <li class="stat">
          <span class="stat__value">312</span>
          <span class="stat__label">Following</span>
        </li>
      </ul>
    </article>
  </body>
</html>
