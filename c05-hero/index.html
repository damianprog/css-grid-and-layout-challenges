<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C5 — Hero banner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="hero">
      <img
        class="hero-image"
        src="https://picsum.photos/id/1018/1600/900"
        alt="Mountain landscape"
      />
      <div class="hero-gradient"></div>

      <div class="hero-text">
        <h1>Walk the high trails</h1>
        <p>Seven days across the ridge, with a guide and no crowds.</p>
        <a href="#">Book a trip</a>
      </div>

      <aside class="hero-card">
        <h2>What's included</h2>
        <p>
          Mountain hut stays, all meals, and a certified guide. Bags are moved
          between huts, so you only carry a daypack.
        </p>
        <a href="#">See the itinerary</a>
      </aside>
    </section>
  </body>
</html>
