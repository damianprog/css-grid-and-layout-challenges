<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C2 — Bento grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="bento">
      <article class="tile tile--hero">
        <h2>Hero</h2>
        <p>2×2 — the main tile.</p>
      </article>
      <article class="tile tile--wide">
        <h2>Wide</h2>
        <p>2 columns × 1 row.</p>
      </article>
      <article class="tile tile--tall">
        <h2>Tall</h2>
        <p>1 column × 2 rows.</p>
      </article>
      <article class="tile">
        <h2>Small 1</h2>
      </article>
      <article class="tile">
        <h2>Small 2</h2>
      </article>
      <article class="tile">
        <h2>Small 3</h2>
      </article>
      <article class="tile">
        <h2>Small 4</h2>
      </article>
    </main>
  </body>
</html>
